<!DOCTYPE html>
<html>
<head>
    <title>lab-5 Js Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">

        <h1>Registration form</h1>

        <form>
            <label for="name">name:</label>
            <input type="text" id="name" class="form-control">
            <br>

            <label for="email">email:</label>
            <input type="email" id="email" class="form-control">
            <br>

            <label for="password">password:</label>
            <input type="password" id="password" class="form-control">
            <p>password must contain ! or ?.</p>

            <button type="button" onclick="registerUser();" class="btn btn-primary">
                register
            </button>
        </form>

        <h2 id="result"></h2>
        <p id="username"></p>
        <p id="useremail"></p>
        <p id="userpassword"></p>

    </div>

    <script>
        function registerUser() {

            let User = {
                name: document.getElementById("name").value.trim(),
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            };

            let message;

            if (
                User.name === "" ||
                User.email === "" ||
                User.password.trim() === ""
            ) {
                message = "registration Failed: All fields are required.";
            } else if (
                User.password.includes("!") ||
                User.password.includes("?")
            ) {
                message = "registration Successful";
            } else {
                message = "registration Failed: Password must contain ! or ?.";
            }

            User.password = "*".repeat(User.password.length);

            document.getElementById("result").textContent = message;

            document.getElementById("userName").textContent =
                "name: " + User.name;

            document.getElementById("userEmail").textContent =
                "email: " + User.email;

            document.getElementById("userPassword").textContent =
                "password: " + User.password;
        }
    </script>

</body>
</html>
